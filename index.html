<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XA DoF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Olympus XA DoF</title>
<style>
:root{
  --bg:#ffffff;--surface-2:#ffffff;--bg-neutral:#f1efe8;
  --text-primary:#1f1f1d;--text-secondary:#5f5e5a;--text-muted:#888780;
  --border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.3);
  --body:#1c1c1b;--body-edge:#000000;--engr:#ece9e1;--engr-dim:#8f8d86;--knurl:#3d3d3a;
  --xa-red:#D93A2B;--xa-yellow:#FAC775;--xa-yellow-ink:#412402;--dof:#1D9E75;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a1a19;--surface-2:#2a2a28;--bg-neutral:#2c2c2a;
    --text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;
    --border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.35);
    --body:#111110;--body-edge:#4a4a47;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text-primary);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-touch-callout:none;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:440px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-size:20px;font-weight:500;margin:0;letter-spacing:.01em}
button{font:inherit;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:0 10px;min-height:44px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.chk{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px;min-height:32px;white-space:nowrap}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--text-primary)}
#aps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:3px;background:var(--body);border:1px solid var(--body-edge);border-radius:12px;margin-bottom:8px}
#aps button{border:none;border-radius:9px;min-height:42px;padding:0;font-size:16px;color:var(--engr);background:transparent}
#aps button.y{color:var(--xa-yellow)}
#aps button[aria-checked="true"]{background:var(--engr);color:var(--body);font-weight:500}
#aps button.y[aria-checked="true"]{background:var(--xa-yellow);color:var(--xa-yellow-ink)}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.dialbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px}
#dial{width:min(100%,360px);height:auto;cursor:grab;touch-action:none;outline:none;user-select:none;-webkit-user-select:none;flex:none;display:block}
#dial:focus-visible{box-shadow:0 0 0 2px #378ADD;border-radius:50%}
#axisSvg{display:block;width:100%;height:auto}
#edge.tk{animation:tke .28s ease-out}
@keyframes tke{0%{stroke:var(--xa-red);stroke-width:5}100%{stroke:var(--body-edge);stroke-width:1}}
#idx{transform-box:fill-box;transform-origin:50% 0}
#idx.tk{animation:tki .28s ease-out}
@keyframes tki{0%{transform:scale(1.6)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#edge.tk,#idx.tk{animation:none}}
.grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.m{background:var(--bg-neutral);border-radius:var(--radius);padding:.5rem .8rem}
.m .l{font-size:12px;color:var(--text-secondary)}
.m .v{font-size:21px;font-weight:500;line-height:1.3}
.hy{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.hy .btns{display:grid;gap:6px}
.hy button{min-height:40px;font-size:14px}
#ybtn{background:var(--xa-yellow);color:var(--xa-yellow-ink);border:1px solid #EF9F27}
@media (max-height:520px){
  main{max-width:none}
  .wrap{flex-direction:row;align-items:center}
  .dialbox{width:min(330px,64dvh);flex:none}
  #dial{width:min(300px,52dvh)}
  .grid{flex:1}
}
#tbl{--c-bg:#1c1c1b;--c-ink:#ece9e1;--c-dim:#8f8d86;--c-line:#3d3d3a;
  margin-top:14px;background:var(--c-bg);color:var(--c-ink);border:1px solid var(--body-edge);border-radius:12px;padding:10px 10px 4px}
#tbl .ct{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;margin:0 2px 6px}
#tbl .ct span:last-child{font-weight:400;color:var(--c-dim);font-size:12px}
#tbl table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
#tbl th,#tbl td{padding:5px 2px;text-align:center;white-space:nowrap;border-top:1px solid var(--c-line)}
#tbl thead th{border-top:none;font-weight:500;padding-bottom:6px}
#tbl th:first-child,#tbl td:first-child{width:13%;text-align:left;padding-left:4px;font-weight:500}
#tbl .yh span{background:var(--xa-yellow);color:var(--xa-yellow-ink);border-radius:4px;padding:0 6px}
#tbl tr.y td:first-child{color:var(--xa-yellow)}
#tbl td.yy{background:var(--xa-yellow);color:var(--xa-yellow-ink);font-weight:500}
#tbl td.c{cursor:pointer}
@media screen{
  #tbl tr.cur td:not(.yy){background:rgba(236,233,225,.08)}
  #tbl td.cur{outline:2px solid var(--xa-red);outline-offset:-2px;border-radius:4px}
}
#printBtn{width:100%;margin-top:8px}
@media print{
  @page{size:A4 portrait;margin:15mm}
  html,body{background:#fff!important;padding:0!important;margin:0}
  main{max-width:none;margin:0}
  main>*:not(#tbl){display:none!important}
  #tbl{width:90mm;margin:0;padding:2.5mm 2.5mm 1mm;border-radius:2mm;border:none;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
  #tbl .ct{font-size:7.5pt;margin:0 .5mm 1mm}
  #tbl .ct span:last-child{font-size:6.5pt}
  #tbl table{font-size:7pt}
  #tbl th,#tbl td{padding:.8mm .3mm}
  #tbl thead th{padding-bottom:1mm}
}
</style>
</head>
<body>
<main>
<header>
<h1>Olympus XA DoF</h1>
<label class="chk"><input type="checkbox" id="snap" checked> Nur Tabellenwerte</label>
</header>

<div id="aps" role="radiogroup" aria-label="Blende"></div>

<div class="wrap">
<div class="dialbox">
<svg id="dial" tabindex="0" aria-label="Fokusring, mit Pfeiltasten drehen" viewBox="0 0 260 255">
<g id="ring">
<circle id="edge" cx="130" cy="135" r="112" fill="var(--body)" stroke="var(--body-edge)" stroke-width="1"/>
<g id="knurl"></g>
<path id="arc" fill="none" stroke="var(--dof)" stroke-opacity=".55" stroke-width="22"/>
<g id="ticks"></g>
<g id="hmark"><circle id="hc" r="9" fill="#BA7517"/><text id="ht" text-anchor="middle" style="font-size:11px;font-weight:500;fill:#FAEEDA">H</text></g>
</g>
<polygon id="idx" points="122,4 138,4 130,16" fill="var(--xa-red)"/>
<circle cx="130" cy="135" r="63" fill="var(--surface-2)" stroke="var(--body-edge)" stroke-width="1"/>
<rect id="cBg" x="96" y="105" width="68" height="30" rx="6" fill="none"/>
<text id="cAp" x="130" y="128" text-anchor="middle" style="font-size:22px;font-weight:500;fill:var(--text-primary)">f/4</text>
<text id="cD" x="130" y="154" text-anchor="middle" style="font-size:15px;fill:var(--text-secondary)">1 m</text>
<text id="cTag" x="130" y="173" text-anchor="middle" style="font-size:11px;fill:var(--text-muted)">Tabellenwert</text>
</svg>
<svg id="axisSvg" viewBox="0 0 440 86" aria-hidden="true">
<line x1="22" y1="34" x2="422" y2="34" stroke="var(--border-strong)" stroke-width="1"/>
<rect id="band" y="22" height="24" rx="4" fill="#1D9E75" fill-opacity=".28" stroke="#1D9E75" stroke-width="1"/>
<g id="axis"></g>
<line id="hl" y1="22" y2="46" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="3 3"/>
<text id="htx" y="84" text-anchor="middle" style="font-size:11px;fill:#BA7517">H</text>
<line id="fl" y1="16" y2="50" stroke="var(--xa-red)" stroke-width="2"/>
<text id="ftx" y="12" text-anchor="middle" style="font-size:11px;fill:var(--xa-red)">Fokus</text>
</svg>
</div>
<div class="grid">
<div class="m"><div class="l">Nahgrenze</div><div class="v" id="mN">–</div></div>
<div class="m"><div class="l">Ferngrenze</div><div class="v" id="mF">–</div></div>
<div class="m"><div class="l">Schärfentiefe</div><div class="v" id="mT">–</div></div>
<div class="m"><div class="l">Davor / dahinter</div><div class="v" id="mS" style="font-size:16px;padding-top:3px">–</div></div>
<div class="m hy">
<div><div class="l">Hyperfokale Distanz</div><div class="v" id="mH">–</div><div style="font-size:11px;color:var(--text-muted)" id="mH2">–</div></div>
<div class="btns">
<button id="ybtn">Gelbe Einstellung</button>
<button id="hbtn">Auf H fokussieren</button>
</div>
</div>
</div>
</div>
<section id="tbl" aria-label="Schärfentiefe-Tabelle">
<div class="ct"><span>Olympus XA</span><span>Schärfentiefe in m</span></div>
<table><thead><tr id="tbh"></tr></thead><tbody id="tbb"></tbody></table>
</section>
<button id="printBtn">Für die Kamerarückseite drucken</button>
</main>

<script>
const I=Infinity,D=[0.85,1,1.5,2,3,5,10,I],U=D.map(d=>d===I?0:1/d),K=150;
const MK=[1,1,1,0,1,0,0,1],YD=3,YA="5.6";
const AP=["2.8","4","5.6","8","11","16","22"];
const T={"2.8":[[.80,.91],[.93,1.08],[1.35,1.69],[1.73,2.37],[2.43,3.93],[3.59,8.27],[5.57,50.1],[12.4,I]],
"4":[[.78,.93],[.91,1.12],[1.30,1.78],[1.65,2.55],[2.26,4.49],[3.23,11.2],[4.74,I],[8.89,I]],
"5.6":[[.76,.97],[.87,1.17],[1.23,1.93],[1.54,2.87],[2.06,5.62],[2.83,22.4],[3.92,I],[6.36,I]],
"8":[[.73,1.03],[.83,1.27],[1.14,2.21],[1.40,3.55],[1.81,9.02],[2.39,I],[3.12,I],[4.47,I]],
"11":[[.69,1.12],[.78,1.41],[1.05,2.69],[1.26,5.02],[1.58,38.1],[2.00,I],[2.48,I],[3.26,I]],
"16":[[.64,1.31],[.71,1.74],[.93,4.24],[1.08,16.7],[1.31,I],[1.58,I],[1.86,I],[2.26,I]],
"22":[[.58,1.66],[.64,2.42],[.81,14.3],[.93,I],[1.08,I],[1.27,I],[1.43,I],[1.65,I]]};
let ap="5.6",u=1/3,drag=null,raw=1/3;
const $=id=>document.getElementById(id),inv=x=>x===I?0:1/x;
try{const st=JSON.parse(localStorage.getItem("xadof")||"{}");
if(AP.includes(st.ap))ap=st.ap;
if(typeof st.u==="number"&&st.u>=0&&st.u<=U[0])u=raw=st.u;
if(typeof st.snap==="boolean")$("snap").checked=st.snap}catch(e){}
const hs=document.createElement("label");hs.setAttribute("aria-hidden","true");hs.style.cssText="position:absolute;left:-9999px;top:0;opacity:0;pointer-events:none";hs.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(hs);
function tick(){["edge","idx"].forEach(id=>{const x=$(id);x.classList.remove("tk");void x.getBoundingClientRect();x.classList.add("tk")});
try{if(navigator.vibrate)navigator.vibrate(8);else hs.click()}catch(e){}}
const fmt=d=>d===I?"∞":(d<10?d.toFixed(2):d.toFixed(1)).replace(".",",")+" m";
const lab=d=>d===I?"∞":String(d).replace(".",",");
const P=(a,r)=>[130+r*Math.sin(a*Math.PI/180),135-r*Math.cos(a*Math.PI/180)];
AP.forEach(k=>{const b=document.createElement("button");b.dataset.k=k;b.textContent=k;b.setAttribute("role","radio");b.setAttribute("aria-label","Blende f/"+k);if(k===YA)b.classList.add("y");b.onclick=()=>{ap=k;draw()};$("aps").appendChild(b)});
let kn="";for(let a=0;a<360;a+=4){const[x1,y1]=P(a,111),[x2,y2]=P(a,106);kn+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--knurl)" stroke-width="1.5"/>`}
$("knurl").innerHTML=kn;
let tk="";for(let a=0;a<=U[0]*K;a+=5){const[x1,y1]=P(a,103),[x2,y2]=P(a,99);tk+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--engr-dim)" stroke-width="1"/>`}
D.forEach((d,i)=>{const a=U[i]*K,m=MK[i],[x1,y1]=P(a,103),[x2,y2]=P(a,m?90:96),[lx,ly]=P(a,79);
tk+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${m?"var(--engr)":"var(--engr-dim)"}" stroke-width="${m?2:1}"/><g transform="rotate(${a} ${lx} ${ly})">`;
if(d===YD)tk+=`<rect x="${lx-12}" y="${ly-9}" width="24" height="18" rx="4" fill="var(--xa-yellow)"/>`;
tk+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" style="font-size:${m?(d===I?17:14):11}px;font-weight:${m?500:400};fill:${d===YD?"var(--xa-yellow-ink)":(m?"var(--engr)":"var(--engr-dim)")}">${lab(d)}</text></g>`});
$("ticks").innerHTML=tk;
const X=uu=>22+(1-uu/2)*400;let ax="";
[[0.5,0],[0.75,0],[0.85,1],[1,1],[1.5,1],[2,0],[3,1],[5,0],[10,0],[I,1]].forEach(([d,m])=>{const x=X(inv(d));
ax+=`<line x1="${x}" y1="46" x2="${x}" y2="${m?55:51}" stroke="${m?"var(--text-primary)":"var(--border-strong)"}" stroke-width="${m?1.5:1}"/>`;
if(d===YD)ax+=`<rect x="${x-11}" y="57" width="22" height="17" rx="4" fill="var(--xa-yellow)"/>`;
ax+=`<text x="${x}" y="70" text-anchor="middle" style="font-size:${m?(d===I?16:13):11}px;font-weight:${m?500:400};fill:${d===YD?"var(--xa-yellow-ink)":(m?"var(--text-primary)":"var(--text-muted)")}">${lab(d)}</text>`});
$("axis").innerHTML=ax;
const TC=[0,1,2,4,7];
const cf=x=>x===I?"∞":(x<1?x.toFixed(2):x<10?x.toFixed(1):String(Math.round(x))).replace(".",",");
$("tbh").innerHTML="<th>f</th>"+TC.map(i=>`<th${D[i]===YD?' class="yh"':""}><span>${lab(D[i])}</span></th>`).join("");
$("tbb").innerHTML=AP.map(k=>`<tr data-k="${k}"${k===YA?' class="y"':""}><td>${k}</td>`+TC.map(i=>{const[n,f]=T[k][i];
return `<td class="c${k===YA&&D[i]===YD?" yy":""}" data-k="${k}" data-i="${i}">${cf(n)}–${cf(f)}</td>`}).join("")+"</tr>").join("");
$("tbb").addEventListener("click",e=>{const td=e.target.closest("td.c");if(!td)return;ap=td.dataset.k;u=U[+td.dataset.i];$("snap").checked=true;draw();window.scrollTo({top:0,behavior:"smooth"})});
$("printBtn").onclick=()=>window.print();
function markTbl(){document.querySelectorAll("#tbb tr").forEach(r=>r.classList.toggle("cur",r.dataset.k===ap));
document.querySelectorAll("#tbb td.c").forEach(td=>td.classList.toggle("cur",td.dataset.k===ap&&Math.abs(U[+td.dataset.i]-u)<1e-6))}
const H=()=>T[ap][7][0];
function calc(){const r=T[ap];let i=0;while(i<6&&u<U[i+1])i++;const t=U[i]===U[i+1]?0:(U[i]-u)/(U[i]-U[i+1]);
const n=1/(inv(r[i][0])+(inv(r[i+1][0])-inv(r[i][0]))*t),fi=inv(r[i][1])+(inv(r[i+1][1])-inv(r[i][1]))*t;
return{n,f:fi<=1e-4?I:1/fi,exact:U.some(v=>Math.abs(v-u)<1e-6)}}
function draw(){
markTbl();
document.querySelectorAll("#aps button").forEach(b=>b.setAttribute("aria-checked",b.dataset.k===ap));
try{localStorage.setItem("xadof",JSON.stringify({ap,u,snap:$("snap").checked}))}catch(e){}
const c=calc(),fd=u===0?I:1/u,h=H();$("ring").setAttribute("transform",`rotate(${-u*K} 130 135)`);
const a1=inv(c.f)*K,a2=1/c.n*K,[x1,y1]=P(a1,92),[x2,y2]=P(a2,92);$("arc").setAttribute("d",`M${x1} ${y1} A92 92 0 0 1 ${x2} ${y2}`);
const ha=K/h,[hx,hy]=P(ha,124);$("hc").setAttribute("cx",hx);$("hc").setAttribute("cy",hy);$("ht").setAttribute("x",hx);$("ht").setAttribute("y",hy+4);$("ht").setAttribute("transform",`rotate(${ha} ${hx} ${hy})`);
const isH=Math.abs(u-1/h)<1e-6,isY=ap===YA&&Math.abs(u-1/YD)<1e-6,yA=ap===YA;
$("cBg").setAttribute("fill",yA?"var(--xa-yellow)":"none");$("cAp").style.fill=yA?"var(--xa-yellow-ink)":"var(--text-primary)";
$("cAp").textContent="f/"+ap;$("cD").textContent=fmt(fd);$("cTag").textContent=isY?"gelbe Einstellung":(isH?"hyperfokal":(c.exact?"Tabellenwert":"interpoliert"));
$("mN").textContent=fmt(c.n);$("mF").textContent=fmt(c.f);$("mT").textContent=c.f===I?"∞":fmt(c.f-c.n);
$("mS").textContent=fd===I?"–":fmt(fd-c.n)+" / "+(c.f===I?"∞":fmt(c.f-fd));
$("mH").textContent=fmt(h);$("mH2").textContent="Fokus auf H: ca. "+fmt(h/2)+" bis ∞";
const xn=X(1/c.n),xf=X(inv(c.f));$("band").setAttribute("x",Math.min(xn,xf));$("band").setAttribute("width",Math.max(2,Math.abs(xf-xn)));
const xF=X(u);$("fl").setAttribute("x1",xF);$("fl").setAttribute("x2",xF);$("ftx").setAttribute("x",Math.min(410,Math.max(30,xF)));
const xH=X(1/h);$("hl").setAttribute("x1",xH);$("hl").setAttribute("x2",xH);$("htx").setAttribute("x",xH)}
function setU(v,user){v=Math.max(0,Math.min(U[0],v));if($("snap").checked)v=U.reduce((b,x)=>Math.abs(x-v)<Math.abs(b-v)?x:b);const p=u;u=v;if(user&&p!==u&&U.some(k=>k!==p&&(k-p)*(k-u)<=0))tick();draw()}
const dial=$("dial"),ang=e=>{const r=dial.getBoundingClientRect();return Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height*135/255))*180/Math.PI};
dial.addEventListener("pointerdown",e=>{dial.setPointerCapture(e.pointerId);drag=ang(e);raw=u;dial.style.cursor="grabbing"});
dial.addEventListener("pointermove",e=>{if(drag===null)return;let a=ang(e),d=a-drag;if(d>180)d-=360;if(d<-180)d+=360;drag=a;raw=Math.max(0,Math.min(U[0],raw-d/K));setU(raw,true)});
const end=()=>{drag=null;dial.style.cursor="grab"};
dial.addEventListener("pointerup",end);dial.addEventListener("pointercancel",end);
dial.addEventListener("wheel",e=>{e.preventDefault();step(e.deltaY>0?1:-1)},{passive:false});
function step(s){let i=U.findIndex(v=>Math.abs(v-u)<1e-6);if(i<0)i=U.findIndex(v=>v<u)-(s>0?1:0);const p=u;u=U[Math.max(0,Math.min(7,i+s))];if(p!==u)tick();draw()}
dial.addEventListener("keydown",e=>{if(["ArrowRight","ArrowUp"].includes(e.key)){e.preventDefault();step(1)}if(["ArrowLeft","ArrowDown"].includes(e.key)){e.preventDefault();step(-1)}});
$("snap").onchange=()=>setU(u);
$("hbtn").onclick=()=>{$("snap").checked=false;u=1/H();draw()};
$("ybtn").onclick=()=>{$("snap").checked=true;ap=YA;u=1/YD;draw()};
draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
